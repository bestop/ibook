@keyframes p-sp{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
.p-cape{animation:p-cp 2.6s ease-in-out infinite}
@keyframes p-cp{0%,100%{transform:skewX(0deg)}50%{transform:skewX(3deg)}}
